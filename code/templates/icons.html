{% macro icon(name, cls='') -%}
<svg class="icon {{ cls }}" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{% if name == 'shield' %}<path d="M12 3 4 6v6c0 4.5 8 9 8 9s8-4.5 8-9V6z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/>
{% elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{% elif name == 'keyboard' %}<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/>
{% elif name == 'activity' %}<path d="M2 12h4l3-7 5 14 3-7h5"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{% elif name == 'logout' %}<path d="M9 4H4v16h5m5-12 4 4-4 4m-5-4h12"/>
{% elif name == 'lock' %}<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>
{% elif name == 'play' %}<path d="m8 4 12 8-12 8z"/>
{% elif name == 'pause' %}<path d="M8 5v14M16 5v14"/>
{% elif name == 'list' %}<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>
{% elif name == 'info' %}<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
{% endif %}</svg>
{%- endmacro %}
